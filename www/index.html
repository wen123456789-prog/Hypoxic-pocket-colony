else if(k.k=='sh'){m.w+=dt;if(m.w>4){R.water=Math.max(0,R.water-2);m.st=Math.max(0,m.st-30);fin()}}
else if(k.k=='sl'){if(!isNight())fin()}
else if(k.k=='dig'){if(!mk[k.i]||!t[k.i])return fin();m.w+=dt;if(m.w>=[0,2,5,2,2][t[k.i]]){dig(k.i);fin()}}
else if(k.k=='bld'){k.b.p+=dt/4;if(k.b.p>=1){k.b.ok=1;log(BD[k.b.k][1]+' 建成')}if(k.b.ok)fin()}
else if(k.k=='op'){m.w+=dt;const b=k.b;if(b.k=='gen'){R.pow=Math.min(PC(),R.pow+3*dt);tp[I(b.x,b.y)]+=4*dt}else if(R.pow>0.5){R.pow-=.5*dt;R.rp+=dt}else fin();if(m.w>8)fin()}}
function bupd(dt){for(const b of B){if(!b.ok)continue;const i=I(b.x,b.y);
if(b.k=='dif'&&R.algae>0){R.algae-=.1*dt;o[i]+=2.2*dt}
if(b.k=='ele'&&R.water>0&&R.pow>0&&wt(b)){R.water-=.1*dt;R.pow-=.3*dt;o[i]+=2.5*dt;tp[i]+=6*dt}
if(b.k=='mus'&&R.dirt>=6){b.w=(b.w||0)+dt;tp[i]+=3*dt;if(b.w>12){b.w=0;R.dirt-=6;R.mush++}}
if(b.k=='skm'&&R.water>0&&R.pow>0&&wt(b)){R.water-=.05*dt;R.pow-=.2*dt;let q=3*dt;for(let u=-3;u<=3;u++)for(let v=-3;v<=3;v++){const a=b.x+u,e=b.y+v;if(a<0||e<0||a>=W||e>=H)continue;const j=I(a,e),z=Math.min(c[j],q);c[j]-=z;q-=z}}}
R.pow=Math.max(0,R.pow);R.water=Math.max(0,R.water)}
function mix(i,j){let d=(o[i]-o[j])*.2;o[i]-=d;o[j]+=d;d=(c[i]-c[j])*.2;c[i]-=d;c[j]+=d}
function gas(){heat();for(let i=0;i<N;i++){if(t[i])continue;if(i%W<W-1&&!t[i+1])mix(i,i+1);if(i+W<N&&!t[i+W]){mix(i,i+W);const f=c[i]*.06;c[i]-=f;c[i+W]+=f}}}
function draw(){x.fillStyle='#0b1014';x.fillRect(0,0,cv.width,cv.height);
for(let i=0;i<N;i++){const a=i%W*C,b=(i/W|0)*C;
if(t[i]){x.fillStyle=COL[t[i]];x.fillRect(a,b,C,C);tileArt(i,a,b);if(mk[i]){x.strokeStyle='#ffd166';x.lineWidth=2;x.strokeRect(a+2,b+2,C-4,C-4)}}
else{x.fillStyle='#18242c';x.fillRect(a,b,C,C);
let al=ov==1?o[i]/110:ov==2?0:o[i]/400;if(al>.01){x.fillStyle=`rgba(90,200,255,${Math.min(.9,al)})`;x.fillRect(a,b,C,C)}
al=ov==2?c[i]/110:ov==1?0:c[i]/300;if(al>.01){x.fillStyle=`rgba(210,170,70,${Math.min(.9,al)})`;x.fillRect(a,b,C,C)}}}
if(ov==3)for(let i=0;i<N;i++){x.fillStyle=`hsla(${240-240*Math.max(0,Math.min(1,(tp[i]+10)/80))},85%,50%,${t[i]?.35:.6})`;x.fillRect(i%W*C,(i/W|0)*C,C,C)}
x.font='bold 11px sans-serif';x.textAlign='left';x.textBaseline='middle';x.fillStyle='#9ab';x.fillText('— 太空 —',6,C);x.fillStyle='#ffe2a0';x.fillText('— 岩浆 —',6,46.5*C);
x.font=(C*.8|0)+'px serif';x.textAlign='center';x.textBaseline='middle';
for(const b of B){x.globalAlpha=b.ok?1:.35+b.p*.4;x.drawImage(IMG[b.k],b.x*C,b.y*C,C,C)}x.globalAlpha=1;
if(anc){x.strokeStyle='#fff';x.lineWidth=2;x.strokeRect(anc[0]*C+1,anc[1]*C+1,C-2,C-2)}
for(const m of D){if(m.dead)continue;const px=m.x*C+C/2,py=m.y*C+C/2;x.fillStyle=m.bk>0?'#e55':'#f2c14e';x.beginPath();x.arc(px,py,C*.38,0,7);x.fill();x.fillStyle='#222';x.fillRect(px-C*.17,py-C*.1,2,2);x.fillRect(px+C*.08,py-C*.1,2,2)}}
const bar=(v,c)=>`<div class=b><i style="width:${Math.max(0,v)}%;background:${c}"></i></div>`;
function ui(){$('#hs').textContent=`第${cyc()}周期 ${isNight()?'🌙':'☀️'}｜泥土${R.dirt|0} 藻${R.algae|0} 水${R.water|0} 营养棒${R.mush} 电${R.pow|0} 研究${R.rp|0}`;
$('#d').innerHTML=D.map(m=>m.dead?`<div class=c>${m.n} ☠</div>`:`<div class=c><b>${m.n}</b>${bar(m.br,'#6cd')}${bar(m.cal,'#eaa')}${bar(100-m.st,'#9d6')}</div>`).join('');
const bt=(l,f,on,dis)=>`<button class="${on?'on':''}" ${dis?'disabled':''} onclick="${f}">${l}</button>`;
const h1=bt('⛏挖掘',"sel('dig')",tool=='dig')+bt('✖取消',"sel('can')",tool=='can')+Object.keys(BD).map(k=>{const d=BD[k],lk=d[3]&&!tech[d[3]];return bt(`${d[0]}${d[1]} ${d[2]}`,`sel('${k}')`,tool==k,lk||R.dirt<d[2])}).join('');const h2=bt('👁'+['标准','氧气','二氧化碳','温度'][ov],'ov=(ov+1)%4;ui()')+bt('⏩×'+spd,'spd=spd%3+1;ui()')+Object.keys(TE).filter(k=>!tech[k]).map(k=>bt(`🧪解锁${TE[k][0]} ${TE[k][1]}`,`unl('${k}')`,0,R.rp<TE[k][1])).join('')+(ready&&D.length<7?bt('🖨招募新复制人','recruit()',1):'');setH('#r1',cats());setH('#bl',list());setH('#r2',tools()+h2)}
function sel(k){tool=tool==k?'':k;anc=null;log(k=='dig'||k=='can'?'点两个对角格框选区域':tool?'点空地放置':'')}
function unl(k){R.rp-=TE[k][1];tech[k]=1;log('已解锁：'+TE[k][0]);ui()}
function recruit(){ready=false;D.push(mkD(NM[D.length%8],11));log('新复制人加入了！');ui()}
cv.onclick=e=>{const r=cv.getBoundingClientRect(),a=Math.floor((e.clientX-r.left)/r.width*W),b=Math.floor((e.clientY-r.top)/r.height*H),i=I(a,b);
if(tool=='dig'||tool=='can'){if(!anc){anc=[a,b];return}for(let u=Math.min(a,anc[0]);u<=Math.max(a,anc[0]);u++)for(let v=Math.min(b,anc[1]);v<=Math.max(b,anc[1]);v++){const j=I(u,v);if(tool=='dig'){if(t[j]&&t[j]<5)mk[j]=1}else{mk[j]=0;if(cl[j])rel(cl[j])}}anc=null}
else if(BD[tool]){const d=BD[tool];if(t[i]||bm[i])return log('这里放不了');if(R.dirt<d[2])return log('泥土不足');R.dirt-=d[2];const nb={k:tool,x:a,y:b,ok:0,p:0};B.push(nb);bm[i]=nb;ui()}else log(`(${a},${b}) ${tp[i]|0}℃ 氧${o[i]|0} 碳${c[i]|0}`)};
const K='oxy-pocket-save',setH=(s,h)=>{const e=$(s);if(e._h!==h){e._h=h;e.innerHTML=h}};
function save(q,s){if(over)return;try{localStorage.setItem(s?K+'-'+s:K,JSON.stringify({cy:cyc(),n:D.filter(m=>!m.dead).length,ts:Date.now(),tp:[...tp].map(v=>+v.toFixed(1)),t:[...t],o:[...o].map(v=>+v.toFixed(1)),c:[...c].map(v=>+v.toFixed(1)),mk:[...mk],R,T,tech,ready,lastPr,B:B.map(b=>({k:b.k,x:b.x,y:b.y,ok:b.ok,p:b.p,w:b.w||0})),D:D.map(m=>({n:m.n,x:Math.round(m.x),y:Math.round(m.y),br:m.br,cal:m.cal,st:m.st,bl:m.bl,hp:m.hp,bk:m.bk,dead:m.dead}))}));if(!q)log('已存档')}catch(e){if(!q)log('存档失败')}}
function load(sl){try{const s=JSON.parse(localStorage.getItem(sl?K+'-'+sl:K));if(!s)return;if(s.tp)tp.set(s.tp);else tp.fill(20);cl.fill(null);tool='';anc=null;over=false;$('#o').style.display='none';t.set(s.t);o.set(s.o);c.set(s.c);mk.set(s.mk);Object.assign(R,s.R);T=s.T;tech=s.tech;ready=s.ready;lastPr=s.lastPr;B=s.B;bm.fill(null);B.forEach(b=>bm[I(b.x,b.y)]=b);D=s.D.map(d=>Object.assign(mkD(d.n,d.x),d,{p:[],tk:null,w:0,cd:0}));log('已读取存档')}catch(e){}}
function newGame(){if(confirm('确定开始新游戏？当前进度会丢失')){over=true;try{localStorage.removeItem(K)}catch(e){}location.reload()}}
let last=0,acc=0,uiT=0;
function loop(ts){const dt=Math.min(.1,(ts-last)/1000)*spd;last=ts;
if(!over&&!paused){T+=dt;acc+=dt;D.forEach(m=>upd(m,dt));bupd(dt);nup(dt);while(acc>.2){acc-=.2;gas()}
if(cyc()%3==0&&cyc()>lastPr){lastPr=cyc();ready=true;log('打印舱就绪：可招募新复制人')}
if(msgT>0&&(msgT-=dt)<=0)$('#m').textContent='';
if(!D.some(m=>!m.dead)){over=true;try{localStorage.removeItem(K)}catch(e){}$('#o').style.display='flex'}
if((uiT+=dt)>.4){uiT=0;ui()}}
draw();requestAnimationFrame(loop)}
load();setInterval(()=>save(1),10000);addEventListener('pagehide',()=>save(1));document.addEventListener('visibilitychange',()=>{if(document.hidden)save(1)});$('#sc').scrollTop=0;ui();log('先「挖掘」附近的藻类(绿)和冰(蓝)，再建扩散器！往下挖要先铺梯子');requestAnimationFrame(loop);
</script></body></html>
